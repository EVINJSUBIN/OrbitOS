<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitOS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="desktop">
        <!-- Example Window -->
        <div class="window" id="example-window" style="top: 100px; left: 100px;">
            <div class="window-header">
                <span class="window-title">Welcome App</span>
                <button class="window-close">X</button>
            </div>
            <div class="window-content">
                <p>Welcome to OrbitOS! 🌌</p>
                <p>Try dragging me around by the title bar.</p>
            </div>
        </div>
    </div>


    <div id="taskbar">
        <button id="start-btn">🚀 Start</button>
        <div id="taskbar-apps"></div>
        <div id="clock">00:00</div>
    </div>

    <script src="script.js"></script>
</body>

</html>
