<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbitOS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <!-- Desktop Icons -->
        <div class="icon" id="icon-notepad">
            <div class="icon-img">📝</div>
            <div class="icon-label">Notepad</div>
        </div>
        <div class="icon" id="icon-browser">
            <div class="icon-img">🌐</div>
            <div class="icon-label">Browser</div>
        </div>
        <div class="icon" id="icon-isstracker">
            <div class="icon-img">🛰️</div>
            <div class="icon-label">ISS Tracker</div>
        </div>
    </div>
    
    <div id="taskbar">
        <button id="start-btn">🚀 Start</button>
        <div id="taskbar-apps"></div>
        <div id="clock">00:00</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
